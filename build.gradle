plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'maven-publish'
}

def INCLUDE_OTHER_ARCHS = "true".equalsIgnoreCase(project.findProperty("includeOtherArchs"))
def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "NeoForge"
        url = "https://maven.neoforged.net/releases/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "caffeinemcRepository"
                url = "https://maven.caffeinemc.net/releases"
            }
        }
        filter {
            includeGroup "net.caffeinemc"
        }
    }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>"
        }
        return result.standardOutput.asText.get().strip()
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>"
    }
}

def buildtime = { (System.currentTimeMillis() / 1000L).longValue() }

sourceSets {
    main {
        java {
            exclude 'me/cortex/voxy/client/config/ModMenuIntegration.java'
            exclude 'me/cortex/voxy/client/iris/**'
            exclude 'me/cortex/voxy/client/core/IrisVoxyRenderPipeline.java'
            exclude 'me/cortex/voxy/client/mixin/flashback/**'
            exclude 'me/cortex/voxy/client/mixin/iris/**'
            exclude 'me/cortex/voxy/client/mixin/nvidium/**'
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinDebugScreenEntryList.java'
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinGlDebug.java'
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinGPUSelect.java'
            exclude 'me/cortex/voxy/commonImpl/mixin/chunky/MixinFabricWorld.java'
        }
    }
}

neoForge {
    version = project.neo_version

    if (project.hasProperty("parchment_version") && !project.parchment_version.toString().isBlank()) {
        parchment {
            minecraftVersion = project.minecraft_version
            mappingsVersion = project.parchment_version
        }
    }

    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            ideName = "NeoForge/Client"
            if (project.hasProperty("lodSmoke")) {
                systemProperty "fragment.lod.smoke", "true"
            }
            if (project.hasProperty("lodAerial")) {
                systemProperty "fragment.lod.aerial", "true"
                systemProperty "fragmentrender.renderDiagnostics", "true"
                systemProperty "fragmentrender.shadowResolution", "1024"
                jvmArguments.add('-Xmx4G')
                if (project.hasProperty("lodWorld")) systemProperty "fragment.lod.world", project.property("lodWorld")
                programArguments.addAll('--width', '960', '--height', '540')
            }
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            ideName = "NeoForge/Server"
        }
    }

    mods {
        voxy {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeOnlyMsk
    sodiumDistribution {
        canBeConsumed = false
        canBeResolved = true
    }
    rocksdbJniDistribution {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    lwjglNativeDistribution {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def sodiumModJar = layout.buildDirectory.file("extracted-deps/sodium-neoforge-mod.jar")
def strippedRocksDbJniJar = layout.buildDirectory.file("stripped-deps/rocksdbjni-10.2.1.jar")
def strippedRocksDbJniDir = layout.buildDirectory.dir("stripped-deps")

tasks.register('extractSodiumModJar', Copy) {
    from({
        zipTree(configurations.sodiumDistribution.singleFile).matching {
            include 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-*-mod.jar'
        }
    })
    into(sodiumModJar.map { it.asFile.parentFile })
    includeEmptyDirs = false
    eachFile {
        path = 'sodium-neoforge-mod.jar'
    }
}

tasks.register('stripRocksDbJni', Jar) {
    archiveFileName = 'rocksdbjni-10.2.1.jar'
    destinationDirectory = strippedRocksDbJniDir
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    manifest {
        attributes('Automatic-Module-Name': 'rocksdbjni')
    }

    from({
        zipTree(configurations.rocksdbJniDistribution.singleFile)
    }) {
        exclude 'librocksdbjni-*'
    }
    from({
        zipTree(configurations.rocksdbJniDistribution.singleFile)
    }) {
        include 'librocksdbjni-linux64.so'
        include 'librocksdbjni-win64.dll'
    }
}

dependencies {
    // Non-mod libraries are not discovered by FML from the dev runtime classpath.
    // Keep them visible to development runs as documented by ModDevGradle.
    additionalRuntimeClasspath 'org.rocksdb:rocksdbjni:10.2.1'
    additionalRuntimeClasspath 'redis.clients:jedis:5.1.0'
    additionalRuntimeClasspath 'org.apache.commons:commons-pool2:2.12.0'
    additionalRuntimeClasspath 'org.tukaani:xz:1.10'
    additionalRuntimeClasspath 'org.lz4:lz4-java:1.8.0'
    additionalRuntimeClasspath 'org.xerial:sqlite-jdbc:3.49.1.0'
    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:natives-linux"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:natives-linux"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:natives-windows"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:natives-windows"
    sodiumDistribution "maven.modrinth:sodium:${project.sodium_version_modrinth}"
    rocksdbJniDistribution 'org.rocksdb:rocksdbjni:10.2.1'

    compileOnly files(sodiumModJar)

    compileOnly "maven.modrinth:iris:${project.iris_version}"
    compileOnly "maven.modrinth:lithium:${project.lithium_version}"
    compileOnly "maven.modrinth:vivecraft:${project.vivecraft_version}"
    compileOnly "maven.modrinth:chunky:${project.chunky_version}"

    if (!isInGHA) {
        // Fragment Render owns terrain shaders in the aerial test pack.
        if (!project.hasProperty("lodAerial")) runtimeOnly "maven.modrinth:iris:${project.iris_version}"
        runtimeOnly "maven.modrinth:lithium:${project.lithium_version}"
    }

    implementation platform("org.lwjgl:lwjgl-bom:${project.lwjgl_version}")

    implementation "org.lwjgl:lwjgl"
    jarJar(implementation("org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}"))
    jarJar(implementation("org.lwjgl:lwjgl-zstd:${project.lwjgl_version}"))
    runtimeOnly "org.lwjgl:lwjgl:${project.lwjgl_version}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl:${project.lwjgl_version}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:natives-linux"
    lwjglNativeDistribution "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:natives-windows"
    lwjglNativeDistribution "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:natives-windows"
    lwjglNativeDistribution "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:natives-linux"
    lwjglNativeDistribution "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:natives-linux"
    if (INCLUDE_OTHER_ARCHS) {
        runtimeOnly "org.lwjgl:lwjgl:${project.lwjgl_version}:natives-linux-arm64"
        runtimeOnly "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:natives-linux-arm64"
        runtimeOnly "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:natives-linux-arm64"
        lwjglNativeDistribution "org.lwjgl:lwjgl-lmdb:${project.lwjgl_version}:natives-linux-arm64"
        lwjglNativeDistribution "org.lwjgl:lwjgl-zstd:${project.lwjgl_version}:natives-linux-arm64"
    }

    jarJar(implementation('redis.clients:jedis:5.1.0'))
    jarJar(implementation('org.rocksdb:rocksdbjni:10.2.1'))
    jarJar(implementation('org.apache.commons:commons-pool2:2.12.0'))
    compileOnly 'org.lz4:lz4-java:1.8.0'
    jarJar(implementation('org.tukaani:xz:1.10'))

    if (!isInGHA) {
        runtimeOnly 'org.xerial:sqlite-jdbc:3.49.1.0'
    } else {
        jarJar(implementation('org.xerial:sqlite-jdbc:3.49.1.0'))
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('extractSodiumModJar')
}

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    inputs.properties("version": version, "commit": hash, "buildtime": time)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": version, "commit": hash, "buildtime": time
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.named('jar', Jar) {
    dependsOn tasks.named('stripRocksDbJni')

    from("LICENSE.md") {
        rename { "${it}_${project.archives_base_name}" }
    }
    from({
        configurations.lwjglNativeDistribution.collect { zipTree(it) }
    }) {
        include 'windows/**'
        include 'linux/**'
        exclude 'META-INF/**'
    }

    manifest {
        attributes([
                "Specification-Title"     : project.archives_base_name,
                "Specification-Version"   : project.version,
                "Implementation-Title"    : project.archives_base_name,
                "Implementation-Version"  : project.version,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    doFirst {
        delete fileTree(getDestinationDirectory().get())
    }

    doLast {
        def jarFile = archiveFile.get().asFile
        def strippedJar = strippedRocksDbJniJar.get().asFile
        def targetEntry = 'META-INF/jarjar/rocksdbjni-10.2.1.jar'
        def tmpFile = new File(jarFile.parentFile, jarFile.name + '.tmp')
        def replaced = false

        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(tmpFile)).withCloseable { out ->
                zip.entries().each { entry ->
                    if (entry.name == targetEntry) {
                        def replacement = new java.util.zip.ZipEntry(targetEntry)
                        replacement.time = entry.time
                        out.putNextEntry(replacement)
                        strippedJar.withInputStream { input -> input.transferTo(out) }
                        out.closeEntry()
                        replaced = true
                    } else {
                        def copy = new java.util.zip.ZipEntry(entry.name)
                        copy.time = entry.time
                        out.putNextEntry(copy)
                        if (!entry.directory) {
                            zip.getInputStream(entry).withCloseable { input -> input.transferTo(out) }
                        }
                        out.closeEntry()
                    }
                }
            }
        }

        if (!replaced) {
            tmpFile.delete()
            throw new GradleException("Could not find ${targetEntry} in ${jarFile}")
        }

        java.nio.file.Files.move(
                tmpFile.toPath(),
                jarFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }

    if (!isInGHA) {
        def hash = gitCommitHash()
        if (!hash.equals("<UnknownCommit>")) {
            archiveClassifier.set(hash.substring(0, 7))
        }
    }
}

// Sodium's bootstrap jar discovers its implementation through its early locator.
// A normal mods-folder distribution avoids JarJar selecting the bootstrap itself
// as the implementation when the distribution is on the development classpath.
tasks.register('prepareSodiumRuntime', Copy) {
    from configurations.sodiumDistribution
    into layout.projectDirectory.dir('run/mods')
}
tasks.named('runClient') {
    dependsOn tasks.named('prepareSodiumRuntime')
}
